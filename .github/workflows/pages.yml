name: Build and deploy static app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python exporter and Colab notebook syntax
        run: |
          python -m py_compile tools/export_onnx.py tools/build_bundle.py tools/export_fp32.py tools/quantize_mobile_int8.py tools/validate_bundle.py
          python -c "import json; json.load(open('notebooks/export_badini_omnivoice.ipynb', encoding='utf-8'))"
      - name: Install dependencies
        run: npm install
      - name: Test generation math
        run: npm test
      - name: Build offline-first app
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
